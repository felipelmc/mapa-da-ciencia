name: Documentação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    name: Construir o site (modo estrito)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --group docs --locked
      - name: Referência em dia com o código
        run: uv run python scripts/gerar_referencias.py --checar
      - run: uv run mkdocs build --strict
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publicar:
    name: Publicar no GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deploy
        uses: actions/deploy-pages@v5
