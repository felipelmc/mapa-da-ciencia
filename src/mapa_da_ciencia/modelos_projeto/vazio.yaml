# Configuração do projeto. Referência completa: https://felipelmc.github.io/mapa-da-ciencia/referencia/configuracao/
versao_config: 1
nome: $nome
titulo: Meu mapa da literatura
descricao: ""

fontes:
  scielo:
    colecao: scl
    revistas:
      - 0104-6276           # troque pelos ISSNs das revistas do seu recorte (`mapa revistas`)
  openalex:
    enriquecer: true

recorte:
  anos: [2015, 2025]
  idioma_analise: en
  idioma_exibicao: pt

# Modelos locais do Ollama, sugeridos pelo perfil "$perfil" desta máquina.
modelos:
  embeddings:
    modelo: $modelo_embeddings
  classificacao:
    modelo: $modelo_classificacao
  rotulos:
    modelo: $modelo_rotulos

# Agrupamento em tópicos (veja "Como os tópicos são construídos" na documentação).
topicos:
  min_cluster_size:         # menor tópico; vazio = automático (1 a cada 200 documentos, mínimo 10)
  min_samples: 5            # maior = mais documentos ficam de fora dos tópicos
  votos_minimos: 3          # quem ficou de fora vai para o tópico com ao menos 3 vizinhos seus
  macrotemas: 7             # grupos de tópicos próximos, cada um com uma cor (máximo 8)

validacao:
  n: 200
  estratificar_por: topico
  semente: 7
