site_name: mapa-da-ciencia
site_description: Observatório da literatura científica com modelos de linguagem locais
site_url: https://felipelmc.github.io/mapa-da-ciencia/
repo_url: https://github.com/felipelmc/mapa-da-ciencia
repo_name: felipelmc/mapa-da-ciencia
edit_uri: edit/main/docs/
copyright: Código sob licença MIT · Projeto independente, sem vínculo oficial com SciELO, OpenAlex ou IBGE

theme:
  name: material
  custom_dir: overrides
  language: pt-BR
  font:
    text: Instrument Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mudar para o tema claro (Prancha)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mudar para o tema escuro (Observatório)
  icon:
    logo: material/telescope
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - css/tema.css

# a versão do pacote no rodapé da abertura (overrides/hooks.py)
# As cópias do iCloud Drive ("index 2.md") são versões antigas das páginas: ficam fora do site.
exclude_docs: |
  * [0-9]
  * [0-9].*
  * [0-9][0-9]
  * [0-9][0-9].*

hooks:
  - overrides/hooks.py

plugins:
  - search:
      lang: pt
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
            docstring_style: google
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

