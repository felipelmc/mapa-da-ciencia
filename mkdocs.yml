site_name: mapa-da-ciencia
site_description: Observatório da literatura científica com modelos de linguagem locais
site_url: https://felipelmc.github.io/mapa-da-ciencia/
repo_url: https://github.com/felipelmc/mapa-da-ciencia
repo_name: felipelmc/mapa-da-ciencia
copyright: Código sob licença MIT · Projeto independente, sem vínculo oficial com SciELO, OpenAlex ou IBGE

theme:
  name: material
  custom_dir: overrides
  language: pt-BR
  font:
    text: Instrument Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mudar para o tema claro (Prancha)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mudar para o tema escuro (Observatório)
  icon:
    logo: material/telescope
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - css/tema.css

# a versão do pacote no rodapé da abertura (overrides/hooks.py)
# As cópias do iCloud Drive ("index 2.md") são versões antigas das páginas: ficam fora do site. As decisões técnicas
# (ADRs) e as notas de desenvolvimento ficam no repositório, legíveis no GitHub, mas não no site, que é para quem usa o
# mapa e lê os resultados (tests/test_site_publico.py confere que nenhuma página publicada aponta para elas).
exclude_docs: |
  * [0-9]
  * [0-9].*
  * [0-9][0-9]
  * [0-9][0-9].*
  /decisoes/
  /desenvolvimento/

hooks:
  - overrides/hooks.py

plugins:
  - search:
      lang: pt
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
            docstring_style: google
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

nav:
  - Início: index.md
  - Documentação: documentacao.md
  - Tutoriais:
      - tutoriais/index.md
      - Explorar o exemplo em 5 minutos: tutoriais/explorar-exemplo.md
      - "Seu primeiro mapa, parte 1: a coleta": tutoriais/primeiro-mapa.md
      - "Seu primeiro mapa, parte 2: tópicos e mapa": tutoriais/primeiro-mapa-topicos.md
      - "Seu primeiro mapa, parte 3: tempo e geografia": tutoriais/primeiro-mapa-tempo-e-geografia.md
      - "Seu primeiro mapa, parte 4: classificação e validação": tutoriais/primeiro-mapa-classificacao.md
      - "Seu primeiro mapa pela interface": tutoriais/primeiro-mapa-pela-interface.md
      - "Oficina no Colab": tutoriais/oficina-colab.md
  - Guias:
      - guias/index.md
      - Instalar e escolher os modelos: guias/instalacao.md
      - Criar um projeto: guias/criar-projeto.md
      - Montar um recorte: guias/recorte.md
      - Importar uma busca do SciELO: guias/importar.md
      - Gerar os tópicos: guias/topicos.md
      - Ler o mapa: guias/ler-o-mapa.md
      - Ler os tópicos no tempo: guias/ler-os-topicos.md
      - Gerar a geografia: guias/geografia.md
      - Ler a geografia: guias/ler-a-geografia.md
      - Gerar as redes: guias/redes.md
      - Ler as redes: guias/ler-as-redes.md
      - Escrever um codebook: guias/codebook.md
      - Classificar os resumos: guias/classificar.md
      - Ler a classificação: guias/ler-a-classificacao.md
      - Codificar a amostra: guias/codificar-a-amostra.md
      - Ler kappa e PABAK: guias/ler-kappa-e-pabak.md
      - Usar o júri de modelos: guias/juri.md
      - Usar o painel: guias/painel.md
      - Exportar figuras: guias/exportar-figuras.md
      - Publicar o site: guias/publicar.md
      - Solução de problemas: guias/problemas.md
  - Referência:
