      - Metodologia em uma página: explicacoes/metodologia.md
      - Fontes de dados: explicacoes/fontes.md
      - Como os tópicos são construídos: explicacoes/topicos.md
      - Geografia da produção: explicacoes/geografia.md
      - Redes de coautoria e citação: explicacoes/redes.md
      - Classificação ancorada em evidência: explicacoes/classificacao.md
      - Desenho da validação: explicacoes/validacao.md
      - Júri de modelos e supervisor: explicacoes/juri.md
