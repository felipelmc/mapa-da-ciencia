<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<meta name="description" content="Observatório da literatura científica: tópicos, classificação e geografia de um corpus de artigos." />
		<!-- Caminho relativo: o mesmo build é servido na raiz e em subcaminhos (ADR 0002). -->
		<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
		<title>mapa da ciência</title>
		<script>
			// Aplica o tema antes da primeira pintura, para não piscar o tema errado.
			// A escolha explícita (botão da barra superior) fica em localStorage; sem ela,
			// segue prefers-color-scheme. A mesma lógica vive em src/lib/estado/tema.svelte.ts.
			(function () {
				var tema = null;
				try {
					tema = localStorage.getItem('mapa-da-ciencia:tema');
				} catch (e) {}
				if (tema !== 'observatorio' && tema !== 'prancha') {
					var claro = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
					tema = claro ? 'prancha' : 'observatorio';
				}
				document.documentElement.setAttribute('data-tema', tema);
			})();
		</script>
		<script>
			// Um "%" solto no endereço (um link editado à mão ou cortado, como "#/mapa?busca=50%") faz o roteador do
			// SvelteKit falhar ao decodificar o hash, e a página fica em branco. Antes de ele começar, cada sequência
			// que não decodifica vira espaço (as válidas, como "S%C3%A3o", ficam). "%25", "%26" e "%2B" também viram
			// espaço, como a busca já faria: o roteador decodifica o hash na carga e os devolveria ao endereço como "%"
			// solto, separador de parâmetros ("a%26b" viraria "a&b", e uma recarga buscaria só "a") e espaço. Editar o
			// hash com o app aberto recarrega a página, e este script roda de novo.
			(function () {
				var i = location.href.indexOf('#');
				if (i < 0) return;
				var h = location.href.slice(i);
				var limpo = h.replace(/%2[56B]/gi, '%20').replace(/(?:%[0-9A-Fa-f]{2})+|%/g, function (m) {
					try {
						decodeURIComponent(m);
						return m;
					} catch (e) {
						return m.replace(/%/g, ' ');
					}
				});
				if (limpo !== h) history.replaceState(history.state, '', location.href.slice(0, i) + limpo);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
